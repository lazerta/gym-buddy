name: python-upload

on:
  push:
    branches:
      - "publisher-input/**"

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: python-upload
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout publisher input
        uses: actions/checkout@v4
        with:
          path: publisher-input
          persist-credentials: false

      - name: Checkout trusted publisher from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: publisher-main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate input bytes and normalize transport encoding
        run: |
          python - <<'PYINPUT'
          import base64, hashlib, json
          from pathlib import Path
          source = Path("publisher-input/.publisher/request.json")
          manifest = json.loads(source.read_text(encoding="utf-8"))
          for item in manifest["files"]:
              if "staged_path" in item:
                  if "content_utf8" in item or "content_base64" in item:
                      raise ValueError("Ambiguous input encoding")
                  root = Path("publisher-input/.publisher/payload").resolve()
                  staged = (root / item.pop("staged_path")).resolve()
                  if not staged.is_relative_to(root) or not staged.is_file():
                      raise ValueError("Staged input must remain inside payload directory")
                  item["content_utf8"] = staged.read_bytes().decode("utf-8")
              if "content_utf8" in item:
                  if "content_base64" in item:
                      raise ValueError("Ambiguous input encoding")
                  item["content_base64"] = base64.b64encode(item.pop("content_utf8").encode("utf-8")).decode("ascii")
              raw = base64.b64decode(item["content_base64"], validate=True)
              if hashlib.sha256(raw).hexdigest() != item["sha256"]:
                  raise ValueError("Staging bytes differ from locally tested file: " + item["path"])
          Path("publisher-request.json").write_text(json.dumps(manifest), encoding="utf-8")
          PYINPUT

      - name: Upload batch and verify CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python publisher-main/tools/github_batch_upload.py
          --manifest publisher-request.json
