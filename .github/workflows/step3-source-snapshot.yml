name: step3-source-snapshot
on:
  push:
    branches: [feature/step3-product-completion-2026-09-25]
    paths: [.github/workflows/step3-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export review baseline and historical schema
        run: |
          mkdir -p snapshot
          git archive --format=tar.gz b949a1e032a851fd867aa895c9bef13a8fb87e5c > snapshot/step3.tar.gz
          git archive --format=tar.gz 466937a6f9ff44114164a31f24bf2a98ece186f2 > snapshot/main.tar.gz
          git rev-parse b949a1e032a851fd867aa895c9bef13a8fb87e5c^{tree} > snapshot/step3.tree
          sha256sum snapshot/*.tar.gz > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: step3-pinned-repair-sources
          path: snapshot/
          retention-days: 1
