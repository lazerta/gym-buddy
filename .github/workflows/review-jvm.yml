name: review-jvm
on:
  push:
    branches: [review/calibration-crosscheck-2026-09-25]
permissions:
  contents: write
concurrency:
  group: review-jvm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply review source batch with optimistic concurrency checks
        env:
          REVIEW_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path, PurePosixPath
          def blob(text):
              if text is None: return None
              data=text.encode()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          request=Path('.review/crosscheck.b64')
          if request.exists():
              batch=json.loads(gzip.decompress(base64.b64decode(request.read_text(),validate=True)))
              changes=[]
              for item in batch['files']:
                  path=PurePosixPath(item['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] in {'app','data','domain','contracts','tools','docs'}
                  target=Path(path)
                  actual=target.read_text() if target.exists() else None
                  if 'edits' in item:
                      if blob(actual)==item['result_blob']: continue
                      assert blob(actual)==item['expected_blob'], f'Concurrent edit at {path}'
                      lines=(actual or '').splitlines(keepends=True)
                      for start,end,replacement in reversed(item['edits']):
                          lines[start:end]=replacement
                      desired=''.join(lines)
                      assert blob(desired)==item['result_blob'], f'Corrupted delta at {path}'
                  else:
                      desired=item['content']
                      if actual==desired: continue
                      assert blob(actual)==item['expected_blob'], f'Concurrent edit at {path}'
                  changes.append((target,desired))
              for target,desired in changes:
                  if desired is None: target.unlink()
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_text(desired)
              if changes:
                  subprocess.run(['git','add','--',*[str(p) for p,_ in changes]],check=True)
                  subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m',batch['message']],check=True)
                  subprocess.run(['git','push','origin','HEAD:refs/heads/'+os.environ['REVIEW_BRANCH']],check=True)
          print('REVIEW_TESTED_SOURCE_SHA='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: JVM and Room regression tests
        run: gradle :domain:test :data:testDebugUnitTest :app:testDebugUnitTest --continue --stacktrace
      - name: Assemble debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Upload review test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-jvm-reports
          path: |
            domain/build/test-results/
            data/build/test-results/
            app/build/test-results/
            data/schemas/
          retention-days: 7
