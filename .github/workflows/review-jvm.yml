name: review-jvm

on:
  push:
    branches: [review/production-regressions-2026-09-24]

permissions:
  contents: read

concurrency:
  group: review-jvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare offline JUnit runner dependencies
        run: |
          mkdir -p review-libs
          curl --fail --retry 3 -L https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o review-libs/junit-4.13.2.jar
          curl --fail --retry 3 -L https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o review-libs/hamcrest-core-1.3.jar
      - uses: actions/upload-artifact@v4
        with:
          name: review-offline-junit
          path: review-libs/
          retention-days: 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: JVM and Room regression tests
        run: gradle :domain:test :data:testDebugUnitTest :app:testDebugUnitTest --continue --stacktrace
      - name: Assemble debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Upload review test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-jvm-reports
          path: |
            domain/build/test-results/
            data/build/test-results/
            app/build/test-results/
            data/schemas/
          retention-days: 7
