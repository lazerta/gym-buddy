name: acceptance-video-candidates-2
on:
  push:
    branches: [infra/local-acceptance-kit-2026-09-25]
    paths: [.github/workflows/acceptance-video-candidates-2.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests yt-dlp
      - name: Download publicly exposed sources only
        run: |
          mkdir candidates
          python - <<'PY'
          import json, subprocess, requests
          from pathlib import Path
          root=Path('candidates')
          url='https://ymove.app/api/free/a16f0235-20eb-4306-b9cc-c01ae51b3b9b'
          result={}
          try:
              r=requests.get(url,timeout=90)
              result={'source_page':'https://ymove.app/free-exercise-videos','media_url':url,'status':r.status_code,'content_type':r.headers.get('Content-Type')}
              if r.status_code==200 and len(r.content)<75_000_000:
                  (root/'lateral-raise.mp4').write_bytes(r.content)
          except Exception as e: result['error']=str(e)
          (root/'lateral-source.json').write_text(json.dumps(result,indent=2))
          smith='https://www.muscleandstrength.com/exercises/smith-machine-squat.html'
          r=requests.get(smith,timeout=45)
          (root/'smith-source.html').write_text(r.text)
          p=subprocess.run(['yt-dlp','--no-playlist','--no-progress','--max-filesize','75M','--write-info-json','-o',str(root/'smith-candidate.%(ext)s'),smith],capture_output=True,text=True,timeout=180)
          (root/'smith-acquisition.log').write_text(p.stdout+p.stderr)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-video-candidates-2-local-only
          path: candidates/
          retention-days: 1
          compression-level: 0
