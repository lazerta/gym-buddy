name: apply-step3-local
on:
  push:
    branches: [feature/step3-product-completion-2026-09-25]
    paths: [.github/workflows/apply-step3-local.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact locally verified overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "466937a6f9ff44114164a31f24bf2a98ece186f2"
          test "$(git merge-base HEAD origin/main)" = "466937a6f9ff44114164a31f24bf2a98ece186f2"
          base64 -d .review/step3-overlay.b64 > /tmp/step3-overlay.tar.gz
          echo "9c2200e6b5a740339281807a838010ae785ed0a76dd537b93549fa923735b02b  /tmp/step3-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/step3-overlay.tar.gz
          rm -f .review/step3-overlay.b64 .github/workflows/apply-step3-local.yml
          rmdir .review 2>/dev/null || true
          git add -A
          git diff --cached --check
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Complete frozen product gaps with durable evidence and workflow state"
          git push origin HEAD:refs/heads/feature/step3-product-completion-2026-09-25
