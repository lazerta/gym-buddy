name: simulator-e2e

on:
  pull_request:
  workflow_dispatch:

jobs:
  simulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout simulator harness
        uses: actions/checkout@v4
        with:
          repository: lazerta/virtual-gym-buddy-simulator-harness
          ref: 5558620bd0353547a51a14229edd4055c1d4afd9
          path: harness-src

      - name: Install harness server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./harness-src

      - name: Generate harness temporal contracts
        run: >-
          python tools/generate_harness_temporal_contracts.py
          --harness-root harness-src
          --output build/harness-contracts/temporal-contracts.tsv

      - name: Prepare deterministic frame session
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          mkdir -p e2e-session/frames e2e-session/ground_truth

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=black:s=640x480:r=30:d=0.2 \
            -frames:v 1 e2e-session/frames/000000.jpg

          cp e2e-session/frames/000000.jpg e2e-session/frames/000001.jpg
          cp e2e-session/frames/000000.jpg e2e-session/frames/000002.jpg

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("e2e-session")
          timestamps = [0, 33333, 66667]
          frames = []

          for i, ts in enumerate(timestamps):
              gt = {
                  "schema_version": 1,
                  "session_id": "android-e2e",
                  "exercise_id": "smith_squat",
                  "frame_id": i,
                  "timestamp_us": ts,
                  "expected_transport": True,
              }
              gt_path = root / "ground_truth" / f"{i:06d}.json"
              gt_path.write_text(json.dumps(gt) + "\n", encoding="utf-8")

              frames.append({
                  "frame_id": i,
                  "timestamp_us": ts,
                  "width": 640,
                  "height": 480,
                  "mime_type": "image/jpeg",
                  "image_path": f"frames/{i:06d}.jpg",
                  "ground_truth_path": f"ground_truth/{i:06d}.json",
              })

          manifest = {
              "schema_version": 1,
              "session_id": "android-e2e",
              "exercise_id": "smith_squat",
              "fps": 30.0,
              "width": 640,
              "height": 480,
              "source": "github-actions-fixture",
              "frames": frames,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Start harness frame server
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m harness.frame_server \
            --session e2e-session \
            --host 0.0.0.0 \
            --port 8788 \
            > frame-server.log 2>&1 &
          echo $! > frame-server.pid

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/v1/session >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat frame-server.log
          exit 1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Harness-derived temporal contract gate
        env:
          GYM_BUDDY_HARNESS_TEMPORAL_FIXTURE: ${{ github.workspace }}/build/harness-contracts/temporal-contracts.tsv
        run: >-
          gradle :domain:test
          --tests com.gymbuddy.domain.integration.HarnessTemporalContractTest
          --stacktrace

      - name: Production movement vertical-slice gate
        run: >-
          gradle :domain:test
          --tests com.gymbuddy.domain.integration.InitialExerciseProfilesIntegrationTest
          --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chown "$USER":"$(id -gn)" /dev/kvm
            sudo chmod 660 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available on this runner"
          fi

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-google_apis-x86_64-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot ready"

      - name: Run emulator E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/simulator-e2e.sh

      - name: Verify posted MediaPipe and production results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path("e2e-results.json").read_text())
          assert len(results) == 3, results

          expected_ts = [0, 33333, 66667]
          production_keys = {
              "tracking_state",
              "tracking_reason",
              "camera_guidance",
              "set_lifecycle_state",
              "rep_count",
              "rep_events",
              "cues",
          }
          for i, item in enumerate(results):
              assert item["session_id"] == "android-e2e"
              assert item["frame_id"] == i
              assert item["timestamp_us"] == expected_ts[i]
              analysis = item["analysis"]
              assert "mediapipe_timestamp_ms" in analysis
              assert "pose_count" in analysis
              assert "landmarks" in analysis
              assert "world_landmarks" in analysis
              missing = production_keys - set(analysis)
              assert not missing, (i, missing, analysis)
              assert isinstance(analysis["rep_count"], int)
              assert isinstance(analysis["rep_events"], list)
              assert isinstance(analysis["cues"], list)

          print("ANDROID_SIMULATOR_MEDIAPIPE_PRODUCTION_E2E_PASS")
          PY

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-e2e-diagnostics
          path: |
            e2e-results.json
            production-movement-e2e.json
            frame-server.log
          if-no-files-found: ignore