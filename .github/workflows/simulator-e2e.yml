name: simulator-e2e

on:
  pull_request:
  workflow_dispatch:

jobs:
  simulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout simulator harness
        uses: actions/checkout@v4
        with:
          repository: lazerta/virtual-gym-buddy-simulator-harness
          ref: d8a6e9569f424c4d97ddde5d1c41df93201f163d
          path: harness-src

      - name: Install harness server and scientific renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./harness-src[mujoco]"

      - name: Generate harness temporal contracts
        run: >-
          python tools/generate_harness_temporal_contracts.py
          --harness-root harness-src
          --output build/harness-contracts/temporal-contracts.tsv

      - name: Generate harness camera/tracking contracts
        run: >-
          python tools/generate_harness_camera_tracking_contracts.py
          --harness-root harness-src
          --output build/harness-contracts/camera-tracking-contracts.tsv

      - name: Generate harness primary-subject-lock contracts
        run: >-
          python tools/generate_harness_primary_subject_lock_contracts.py
          --harness-root harness-src
          --output build/harness-contracts/primary-subject-lock-contracts.tsv

      - name: Generate harness form/cue contracts
        run: >-
          python tools/generate_harness_form_cue_contracts.py
          --harness-root harness-src
          --output build/harness-contracts/form-cue-contracts.tsv

      - name: Generate harness composite fuzz safety contracts
        run: >-
          python tools/generate_harness_fuzz_safety_contracts.py
          --harness-root harness-src
          --output build/harness-contracts/fuzz-safety-contracts.tsv

      - name: Prepare rendered MyoFullBody human frame session
        shell: bash
        env:
          MUJOCO_GL: egl
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl libegl1
          python - <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np
          from harness.mujoco_backend import MyoFullBodySimulator
          from harness.mujoco_frame_export import MujocoFrameExporter, RenderCameraConfig
          from harness.motion_sources import MotionTrajectory

          sim = MyoFullBodySimulator()
          q0 = sim.model.qpos0[sim.human_qpos_indices].copy()
          motion = MotionTrajectory(
              qpos=np.stack([q0, q0, q0], axis=0),
              fps=30.0,
              source="ci-myofullbody-default-pose",
          )
          camera = RenderCameraConfig(
              width=640,
              height=480,
              azimuth_deg=90.0,
              elevation_deg=-8.0,
              distance_m=3.2,
              lookat_z=1.0,
          )
          with MujocoFrameExporter(simulator=sim, camera=camera) as exporter:
              manifest = exporter.export_motion(
                  motion,
                  Path("e2e-session"),
                  session_id="android-e2e",
                  exercise_id="smith_squat",
                  overwrite=True,
              )
          assert len(manifest.frames) == 3
          for record in manifest.frames:
              image = cv2.imread(str(Path("e2e-session") / record.image_path))
              assert image is not None and image.shape == (480, 640, 3)
              assert float(image.std()) > 1.0, "rendered human frame is effectively blank"
          print("MUJOCO_HUMAN_RGB_SESSION_PASS")
          PY
      - name: Start harness frame server
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m harness.frame_server \
            --session e2e-session \
            --host 0.0.0.0 \
            --port 8788 \
            > frame-server.log 2>&1 &
          echo $! > frame-server.pid

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/v1/session >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat frame-server.log
          exit 1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Harness-derived temporal contract gate
        env:
          GYM_BUDDY_HARNESS_TEMPORAL_FIXTURE: ${{ github.workspace }}/build/harness-contracts/temporal-contracts.tsv
        run: >-
          gradle :domain:test
          --tests com.gymbuddy.domain.integration.HarnessTemporalContractTest
          --stacktrace

      - name: Harness-derived camera/tracking contract gate
        env:
          GYM_BUDDY_HARNESS_CAMERA_TRACKING_FIXTURE: ${{ github.workspace }}/build/harness-contracts/camera-tracking-contracts.tsv
        run: >-
          gradle :domain:test
          --tests com.gymbuddy.domain.integration.HarnessCameraTrackingContractTest
          --stacktrace

      - name: Harness-derived primary-subject-lock contract gate
        env:
          GYM_BUDDY_HARNESS_IDENTITY_FIXTURE: ${{ github.workspace }}/build/harness-contracts/primary-subject-lock-contracts.tsv
        run: >-
          gradle :domain:test
          --tests com.gymbuddy.domain.integration.HarnessPrimarySubjectLockContractTest
          --stacktrace

      - name: Harness-derived form/cue contract gate
        env:
          GYM_BUDDY_HARNESS_FORM_CUE_FIXTURE: ${{ github.workspace }}/build/harness-contracts/form-cue-contracts.tsv
        run: >-
          gradle :domain:test
          --tests com.gymbuddy.domain.integration.HarnessFormCueContractTest
          --stacktrace

      - name: Harness-derived composite fuzz safety gate
        env:
          GYM_BUDDY_HARNESS_FUZZ_SAFETY_FIXTURE: ${{ github.workspace }}/build/harness-contracts/fuzz-safety-contracts.tsv
        run: >-
          gradle :domain:test
          --tests com.gymbuddy.domain.integration.HarnessFuzzSafetyContractTest
          --stacktrace

      - name: Production movement vertical-slice gate
        run: >-
          gradle :domain:test
          --tests com.gymbuddy.domain.integration.InitialExerciseProfilesIntegrationTest
          --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chown "$USER":"$(id -gn)" /dev/kvm
            sudo chmod 660 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available on this runner"
          fi

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-google_apis-x86_64-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot ready"

      - name: Run emulator E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/simulator-e2e.sh

      - name: Verify posted MediaPipe and production results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path("e2e-results.json").read_text())
          assert len(results) == 3, results

          expected_ts = [0, 33333, 66667]
          production_keys = {
              "tracking_state",
              "tracking_reason",
              "camera_guidance",
              "set_lifecycle_state",
              "rep_count",
              "rep_events",
              "cues",
          }
          detected_pose = False
          for i, item in enumerate(results):
              assert item["session_id"] == "android-e2e"
              assert item["frame_id"] == i
              assert item["timestamp_us"] == expected_ts[i]
              analysis = item["analysis"]
              assert "mediapipe_timestamp_ms" in analysis
              assert "pose_count" in analysis
              detected_pose = detected_pose or analysis["pose_count"] > 0
              assert "landmarks" in analysis
              assert "world_landmarks" in analysis
              missing = production_keys - set(analysis)
              assert not missing, (i, missing, analysis)
              assert isinstance(analysis["rep_count"], int)
              assert isinstance(analysis["rep_events"], list)
              assert isinstance(analysis["cues"], list)

          assert detected_pose, "MediaPipe did not detect the rendered MyoFullBody human in any RGB frame"
          print("ANDROID_SIMULATOR_MEDIAPIPE_HUMAN_RGB_E2E_PASS")
          PY

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-e2e-diagnostics
          path: |
            e2e-results.json
            production-movement-e2e.json
            step3-review-e2e.json
            step4-whole-workflow-e2e.json
            process-recovery-results/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            postmerge-integration-e2e.json
            runtime-boundary-e2e.json
            frame-server.log
          if-no-files-found: ignore
